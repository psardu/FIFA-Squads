<!DOCTYPE html><html><head><meta charset="utf-8"><title>Header preview</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#05143a; font-family:Arial,Helvetica,sans-serif; padding:40px; }
.wrap { max-width:430px; margin:0 auto; }
#home-header { position:relative; background:#000A2E; border-bottom:2.5px solid #C9A84C; padding:20px 20px 12px; text-align:center; border-radius:6px; }
.eyebrow-row { display:inline-block; position:relative; margin-bottom:8px; }
.eyebrow { display:inline-block; background:#C9A84C; color:#000A2E; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:3px 14px; border-radius:2px; margin-bottom:0; }
#home-header h1 { font-size:38px; font-weight:900; color:#fff; text-transform:uppercase; letter-spacing:3px; line-height:1.05; }
#home-header h1 em { color:#C9A84C; font-style:normal; }
.help-btn { font-size:11px; font-weight:700; color:rgba(201,168,76,0.8); border:1px solid rgba(201,168,76,0.35); border-radius:20px; padding:2px 8px; text-decoration:none; display:inline-block; position:absolute; left:calc(100% + 20px); top:50%; transform:translateY(-50%); }
.divider { width:48px; height:2px; background:#C9A84C; margin:8px auto; opacity:0.5; }
#home-header .stats { display:flex; justify-content:center; margin-top:0; text-align:center; }
#home-header .stat { flex:1; text-align:center; padding:0 6px; }
#home-header .stat + .stat { border-left:1px solid rgba(201,168,76,0.25); }
#home-header .stat-n { font-size:26px; font-weight:900; color:#C9A84C; line-height:1; }
#home-header .stat-l { font-size:8px; color:rgba(255,255,255,0.38); text-transform:uppercase; letter-spacing:1px; margin-top:3px; }
.pill { font-size:11px; color:rgba(201,168,76,0.8); border:1px solid rgba(201,168,76,0.35); border-radius:20px; padding:4px 12px; text-decoration:none; }
.note { color:rgba(255,255,255,0.5); font-size:12px; text-align:center; margin-top:16px; }
</style></head>
<body><div class="wrap">
<div id="home-header">
<div class="eyebrow-row"><div class="eyebrow">Un-Official Squad Guide</div><a class="help-btn" href="#">?</a></div>
<h1><em>FIFA</em> WORLD CUP <em>2026</em></h1>
<div class="divider"></div>
<div class="stats">
<div class="stat"><div class="stat-n">48</div><div class="stat-l">Nations</div></div>
<div class="stat"><div class="stat-n">1,252</div><div class="stat-l">Players</div></div>
<div class="stat"><div class="stat-n">453</div><div class="stat-l">Clubs</div></div>
</div>
<div style="display:flex;justify-content:center;gap:8px;margin:10px 0 0;"><a class="pill" href="#">A &#x2192; Z</a><a class="pill" href="#">By Groups</a><a class="pill" href="#">By Ranking</a></div>
</div>
<div class="note">Eyebrow stays centred; "?" sits 20px to its right. Hosts line removed; even 8px gaps.</div>
</div></body></html>
